<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0C0B0A" />
  <title>For Amrita Ma’am</title>
  <meta name="description" content="Something I wanted to give you." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500&family=Homemade+Apple&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%23D9A5A0'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- ambient dark vignette over everything, purely decorative -->
  <div id="vignette" aria-hidden="true"></div>

  <!-- intro card -->
  <section id="intro" class="layer" aria-live="polite">
    <div class="intro-inner">
      <p class="intro-eyebrow">for</p>
      <h1 class="intro-title">Amrita Ma’am</h1>
      <p class="intro-line">Something I wanted to give you.</p>
      <p class="intro-hint">Reach out.</p>
      <div class="intro-actions">
        <button id="btn-camera" class="ghost-button" type="button">Enable camera</button>
        <button id="btn-nocam" class="text-button" type="button">Continue without camera</button>
      </div>
    </div>
  </section>

  <!-- the opening whisper: "Amrita Ma'am…" -->
  <div id="whisper" class="layer" aria-hidden="true"><span>Amrita Ma’am…</span></div>

  <!-- gesture guide: how to open each hand -->
  <div id="instructions" class="layer" aria-hidden="true">
    <div class="guide-hand guide-left">
      <div class="guide-svg"><svg viewBox="0 0 120 120" aria-hidden="true">
          <g class="hand-index"><line x1="46" y1="62" x2="46" y2="24"/></g>
          <line x1="60" y1="62" x2="60" y2="18"/>
          <line x1="74" y1="62" x2="74" y2="23"/>
          <line x1="87" y1="64" x2="87" y2="34"/>
          <path class="hand-palm" d="M40 62 H92 V94 A26 26 0 0 1 40 94 Z"/>
          <g class="hand-thumb"><line x1="41" y1="84" x2="16" y2="58"/></g>
          <path class="hand-arc" d="M22 48 Q30 26 44 18"/>
        </svg></div>
      <p class="guide-label"><span class="instr-key">Left hand</span><span class="instr-dot">·</span>Grow</p>
    </div>
    <div class="guide-hand guide-right">
      <div class="guide-svg mirrored"><svg viewBox="0 0 120 120" aria-hidden="true">
          <g class="hand-index"><line x1="46" y1="62" x2="46" y2="24"/></g>
          <line x1="60" y1="62" x2="60" y2="18"/>
          <line x1="74" y1="62" x2="74" y2="23"/>
          <line x1="87" y1="64" x2="87" y2="34"/>
          <path class="hand-palm" d="M40 62 H92 V94 A26 26 0 0 1 40 94 Z"/>
          <g class="hand-thumb"><line x1="41" y1="84" x2="16" y2="58"/></g>
          <path class="hand-arc" d="M22 48 Q30 26 44 18"/>
        </svg></div>
      <p class="guide-label"><span class="instr-key">Right hand</span><span class="instr-dot">·</span>Bloom</p>
    </div>
    <p class="guide-note">Palms to the camera, about an arm’s length away. Slowly open thumb and finger.</p>
  </div>
  <div id="fallback-note" class="layer" aria-hidden="true"></div>

  <!-- the apology, integrated below the bouquet -->
  <div id="message" class="layer" aria-live="polite">
    <p id="msg-name" class="msg-line msg-name">Amrita Ma’am</p>
    <p id="msg-sorry" class="msg-line msg-sorry">I’m sorry, Ma’am.</p>
    <p id="msg-hand" class="msg-line msg-hand">I wanted to say it properly,<br />so I made you these.</p>
  </div>

  <!-- webcam: small, quiet, bottom-right -->
  <div id="cam-wrap" aria-hidden="true">
    <video id="webcam" autoplay muted playsinline></video>
    <canvas id="hand-overlay"></canvas>
  </div>

  <!-- developer panel (D) -->
  <div id="debug" class="layer" hidden></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
